  /*
    Deliberate single-theme: the whole point is a fixed spec (blueprint navy,
    hairline grid) that content lives inside of, so it doesn't repaint for
    OS light/dark preference any more than a real blueprint would.
  */
  :root {
    --navy: #0e2a4d;
    --navy-deep: #081a30;
    --grid-line: rgba(148, 197, 255, 0.14);
    --grid-line-strong: rgba(148, 197, 255, 0.32);
    --paper: #f4f6f5;
    --ink: #10161d;
    --ink-soft: #57626d;
    --ink-faint: #93a0aa;
    --on-navy: #cfe0f5;
    --on-navy-dim: #6f8caf;
    --accent: #2fb1e0;
    --font-display: 'Bricolage Grotesque', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: #05070b;
    min-height: 100%;
    font-family: var(--font-display);
  }

  ::selection { background: var(--accent); color: var(--navy-deep); }

  button {
    font-family: inherit;
    color: inherit;
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: none;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Presentation frame ---------- */

  .stand {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1rem;
    background:
      radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1.4px);
    background-size: 16px 16px;
  }

  .device {
    width: 390px;
    height: 844px;
    border-radius: 46px;
    border: 10px solid #000;
    box-shadow: 0 40px 90px -20px rgba(0,0,0,0.8), 0 2px 0 rgba(255,255,255,0.05) inset;
    position: relative;
    overflow: hidden;
    background: var(--navy);
    flex-shrink: 0;
  }

  .notch {
    position: absolute;
    top: 13px;
    left: 50%;
    transform: translateX(-50%);
    width: 104px;
    height: 25px;
    background: #000;
    border-radius: 20px;
    z-index: 30;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  @media (max-width: 559px) {
    .stand { padding: 0; align-items: stretch; }
    .device {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    .notch { display: none; }
  }

  /* ---------- Blueprint ground ---------- */

  .blueprint {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
  }

  /* ---------- Shell header (never changes) ---------- */

  .shell-header {
    position: relative;
    z-index: 2;
    padding: calc(0.9rem + env(safe-area-inset-top, 0px)) 1.1rem 0.7rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    flex-shrink: 0;
  }

  .spec-tag {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: var(--on-navy-dim);
  }

  .switcher {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.4rem;
    padding: 0.28rem;
    border: 1px solid var(--grid-line-strong);
    border-radius: 12px;
    background: rgba(0,0,0,0.18);
  }

  .tab {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    color: var(--on-navy-dim);
    padding: 0.5rem 0.2rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tab[aria-pressed="true"] {
    background: var(--accent);
    color: var(--navy-deep);
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ---------- Ruler ---------- */

  .ruler {
    position: relative;
    z-index: 2;
    height: 20px;
    margin: 0 1.1rem;
    flex-shrink: 0;
    border-bottom: 1px solid var(--grid-line-strong);
  }

  .ruler span {
    position: absolute;
    bottom: 4px;
    font-family: var(--font-mono);
    font-size: 0.56rem;
    color: var(--on-navy-dim);
    transform: translateX(-50%);
  }

  .ruler i {
    position: absolute;
    bottom: 0;
    width: 1px;
    height: 6px;
    background: var(--grid-line-strong);
  }

  /* ---------- Frame that holds the card (position never changes) ---------- */

  .frame {
    position: relative;
    z-index: 2;
    flex: 1;
    padding: 1.4rem 1.1rem 1.1rem;
    display: flex;
    align-items: flex-start;
    overflow-y: auto;
  }

  .coord {
    position: absolute;
    font-family: var(--font-mono);
    font-size: 0.56rem;
    color: var(--on-navy-dim);
    letter-spacing: 0.03em;
    z-index: 3;
  }

  .coord-tl { top: 0.35rem; left: 1.15rem; }
  .coord-br { bottom: 0.35rem; right: 1.15rem; }

  .card {
    width: 100%;
    background: var(--paper);
    border-radius: 22px;
    padding: 1.3rem 1.3rem 1.5rem;
    box-shadow: 0 24px 50px -16px rgba(0,0,0,0.55);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  .slot-tag {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }

  .slot-tag b {
    color: var(--ink-soft);
    font-weight: 500;
  }

  .hero {
    display: flex;
    align-items: baseline;
    gap: 0.35rem;
    line-height: 1;
  }

  .hero-value {
    font-weight: 800;
    font-size: 3.6rem;
    letter-spacing: -0.02em;
    color: var(--accent);
    transition: color 0.3s ease;
    font-variant-numeric: tabular-nums;
  }

  .hero-unit {
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--ink-soft);
  }

  .subline {
    margin: -0.5rem 0 0;
    font-weight: 400;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 34ch;
  }

  .chip-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
  }

  .chip {
    border: 1px solid #dfe3e0;
    border-radius: 10px;
    padding: 0.5rem 0.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    align-items: center;
    text-align: center;
  }

  .chip-label {
    font-family: var(--font-mono);
    font-size: 0.56rem;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
  }

  .chip-value {
    font-weight: 600;
    font-size: 0.86rem;
    font-variant-numeric: tabular-nums;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .list li {
    display: flex;
    justify-content: space-between;
    padding: 0.55rem 0;
    border-top: 1px solid #e7eae7;
    font-size: 0.86rem;
  }

  .list li:first-child { border-top: none; }

  .list-label { color: var(--ink); font-weight: 500; }
  .list-value { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .action {
    margin-top: 0.1rem;
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: 12px;
    background: var(--accent);
    color: var(--navy-deep);
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.1s ease;
  }

  .action:active { transform: scale(0.98); }

  .fade {
    transition: opacity 0.12s ease;
  }

  .fade.hidden { opacity: 0; }

  /* ---------- Shell footer (never changes) ---------- */

  .shell-footer {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    color: var(--on-navy-dim);
    padding: 0.7rem 0 calc(0.7rem + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--grid-line);
  }
</style>

<div class="stand">
  <div class="device">
    <div class="notch" aria-hidden="true"></div>
    <div class="screen">
      <div class="blueprint" aria-hidden="true"></div>

      <header class="shell-header">
        <span class="spec-tag">SPEC-001 &middot; POSITIONS FIXED</span>
        <nav class="switcher" id="switcher">
          <button class="tab" data-domain="morning" aria-pressed="true" type="button">MORNING</button>
          <button class="tab" data-domain="table" aria-pressed="false" type="button">TABLE</button>
          <button class="tab" data-domain="flight" aria-pressed="false" type="button">FLIGHT</button>
          <button class="tab" data-domain="plant" aria-pressed="false" type="button">PLANT</button>
        </nav>
      </header>

      <div class="ruler" aria-hidden="true">
        <i style="left:0"></i><span style="left:0">0</span>
        <i style="left:33%"></i><span style="left:33%">100</span>
        <i style="left:66%"></i><span style="left:66%">200</span>
        <i style="left:100%"></i><span style="left:100%">300</span>
      </div>

      <main class="frame">
        <span class="coord coord-tl">X24 Y96</span>

        <div class="card">
          <div class="slot-tag">SLOT.01 &middot; <b id="eyebrow">TEMPERATURE</b></div>

          <div class="hero fade" id="heroBlock">
            <span class="hero-value" id="heroValue">72</span><span class="hero-unit" id="heroUnit">&deg;F</span>
          </div>

          <p class="subline fade" id="subline">Clear through noon, rain after 6pm.</p>

          <div class="chip-row fade" id="chipRow"></div>

          <ul class="list fade" id="list"></ul>

          <button class="action" id="actionBtn" type="button">Plan my walk</button>
        </div>

        <span class="coord coord-br">X366 Y812</span>
      </main>

      <footer class="shell-footer">GRAMMAR: FIXED &middot; CONTENT: GENERATED</footer>
    </div>
  </div>
</div>

<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DOMAINS = {
    morning: {
      accent: '#2fb1e0',
      eyebrow: 'TEMPERATURE',
      heroValue: '72',
      heroUnit: '°F',
      subline: 'Clear through noon, rain after 6pm.',
      chips: [['HIGH', '78°'], ['LOW', '61°'], ['WIND', '6MPH']],
      list: [['9 AM', '71°'], ['12 PM', '76°'], ['3 PM', '74°']],
      action: 'Plan my walk'
    },
    table: {
      accent: '#ff6b4a',
      eyebrow: 'RESERVATION',
      heroValue: '7:30',
      heroUnit: 'PM',
      subline: 'Party of four, confirmed for tonight.',
      chips: [['PARTY', '4'], ['DEPOSIT', '$0'], ['HOLD', '15MIN']],
      list: [['7:00', 'open'], ['8:15', 'open'], ['9:00', 'open']],
      action: 'Hold this table'
    },
    flight: {
      accent: '#7c5cff',
      eyebrow: 'SEAT',
      heroValue: '14A',
      heroUnit: '',
      subline: 'Boards in 40 minutes at Gate B12.',
      chips: [['BOARD', '6:40P'], ['GATE', 'B12'], ['SEAT', '14A']],
      list: [['Security', '~15 min'], ['Lounge', 'B12'], ['Boarding', '6:40 PM']],
      action: 'Add to wallet'
    },
    plant: {
      accent: '#3fae6b',
      eyebrow: 'SOIL MOISTURE',
      heroValue: '62',
      heroUnit: '%',
      subline: 'Water in about 2 days at this rate.',
      chips: [['LIGHT', 'MED'], ['WATERED', '5D AGO'], ['POT', '6IN']],
      list: [['Watered', 'Jul 28'], ['Fertilized', 'Jul 15'], ['Repotted', 'Jun 2']],
      action: 'Log a watering'
    }
  };

  var el = {
    eyebrow: document.getElementById('eyebrow'),
    heroValue: document.getElementById('heroValue'),
    heroUnit: document.getElementById('heroUnit'),
    subline: document.getElementById('subline'),
    chipRow: document.getElementById('chipRow'),
    list: document.getElementById('list'),
    actionBtn: document.getElementById('actionBtn'),
    heroBlock: document.getElementById('heroBlock'),
    switcher: document.getElementById('switcher')
  };

  var fadeTargets = [el.heroBlock, el.subline, el.chipRow, el.list];

  var SCRAMBLE_CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ:%';

  function scrambleTo(node, finalText, frames, onDone) {
    if (reduceMotion) { node.textContent = finalText; if (onDone) onDone(); return; }
    var i = 0;
    var timer = setInterval(function () {
      i++;
      if (i >= frames) {
        clearInterval(timer);
        node.textContent = finalText;
        if (onDone) onDone();
        return;
      }
      var scrambled = '';
      for (var c = 0; c < finalText.length; c++) {
        var ch = finalText[c];
        if (/[a-zA-Z0-9]/.test(ch)) {
          scrambled += SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
        } else {
          scrambled += ch;
        }
      }
      node.textContent = scrambled;
    }, 35);
  }

  function renderChips(pairs) {
    el.chipRow.innerHTML = pairs.map(function (p) {
      return '<div class="chip"><span class="chip-label">' + p[0] + '</span><span class="chip-value">' + p[1] + '</span></div>';
    }).join('');
  }

  function renderList(rows) {
    el.list.innerHTML = rows.map(function (r) {
      return '<li><span class="list-label">' + r[0] + '</span><span class="list-value">' + r[1] + '</span></li>';
    }).join('');
  }

  function apply(domain) {
    var d = DOMAINS[domain];
    document.documentElement.style.setProperty('--accent', d.accent);

    el.eyebrow.textContent = d.eyebrow;
    el.heroUnit.textContent = d.heroUnit;
    el.subline.textContent = d.subline;
    el.actionBtn.textContent = d.action;
    renderChips(d.chips);
    renderList(d.list);
    scrambleTo(el.heroValue, d.heroValue, 6);
  }

  function switchTo(domain) {
    var tabs = el.switcher.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute('aria-pressed', tabs[i].dataset.domain === domain ? 'true' : 'false');
    }

    if (reduceMotion) {
      apply(domain);
      return;
    }

    fadeTargets.forEach(function (t) { t.classList.add('hidden'); });
    window.setTimeout(function () {
      apply(domain);
      fadeTargets.forEach(function (t) { t.classList.remove('hidden'); });
    }, 130);
  }

  el.switcher.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    switchTo(btn.dataset.domain);
  });

  apply('morning');
})();
</script>
