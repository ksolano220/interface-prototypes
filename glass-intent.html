  /*
    Deliberate single-theme world: this is a night scene where translucent
    glass sits over a moving aurora. Liquid glass has nothing to refract
    against a light page, so the dark ground is a choice, not a default.
  */
  :root {
    --void: #0a0d14;
    --void-deep: #05070c;
    --aurora-teal: #1fb894;
    --aurora-amber: #e8a33d;
    --aurora-rose: #d4667a;
    --ink: #eceef5;
    --ink-dim: #a9b0c4;
    --ink-faint: #6d7488;
    --glass-fill: rgba(255, 255, 255, 0.06);
    --glass-fill-strong: rgba(255, 255, 255, 0.13);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-border-strong: rgba(255, 255, 255, 0.26);
    --accent: var(--aurora-amber);
    --accent-ink: #2a1a04;
    --font-display: 'Instrument Serif', 'Iowan Old Style', serif;
    --font-body: 'Manrope', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    position: relative;
    isolation: isolate;
  }

  ::selection {
    background: rgba(232, 163, 61, 0.35);
    color: var(--ink);
  }

  button, input {
    font-family: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  /* ---------- Aurora ground ---------- */

  .aurora {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: radial-gradient(ellipse 120% 90% at 50% -10%, var(--void) 0%, var(--void-deep) 60%);
    overflow: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(6px);
    opacity: 0.55;
    mix-blend-mode: screen;
    will-change: transform;
  }

  .blob-teal {
    width: 60vmax;
    height: 60vmax;
    left: -18vmax;
    top: -10vmax;
    background: radial-gradient(circle, rgba(31, 184, 148, 0.55) 0%, rgba(31, 184, 148, 0) 68%);
    animation: driftA 34s ease-in-out infinite;
  }

  .blob-amber {
    width: 55vmax;
    height: 55vmax;
    right: -16vmax;
    top: 8vmax;
    background: radial-gradient(circle, rgba(232, 163, 61, 0.45) 0%, rgba(232, 163, 61, 0) 68%);
    animation: driftB 28s ease-in-out infinite;
  }

  .blob-rose {
    width: 50vmax;
    height: 50vmax;
    left: 18vmax;
    bottom: -20vmax;
    background: radial-gradient(circle, rgba(212, 102, 122, 0.4) 0%, rgba(212, 102, 122, 0) 68%);
    animation: driftC 40s ease-in-out infinite;
  }

  @keyframes driftA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(8vmax, 6vmax) scale(1.12); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-7vmax, 5vmax) scale(1.08); }
  }
  @keyframes driftC {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(5vmax, -6vmax) scale(1.15); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
  }

  /* ---------- Layout ---------- */

  .stage {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(3rem, 8vw, 6rem) 1.5rem 5rem;
    display: flex;
    flex-direction: column;
    gap: clamp(2rem, 5vw, 2.75rem);
  }

  .thesis {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0;
    opacity: 0;
    animation: rise 0.7s ease-out 0.05s forwards;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.3rem, 6.2vw, 3.9rem);
    line-height: 1.06;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    opacity: 0;
    animation: rise 0.8s ease-out 0.16s forwards;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .lede {
    font-size: 1.02rem;
    line-height: 1.55;
    color: var(--ink-dim);
    max-width: 46ch;
    margin: 0;
    opacity: 0;
    animation: rise 0.8s ease-out 0.28s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow, h1, .lede, .console { animation: none !important; opacity: 1 !important; }
  }

  /* ---------- Glass material ---------- */

  .glass {
    background: linear-gradient(155deg, var(--glass-fill-strong), var(--glass-fill) 60%);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      inset 0 0 40px rgba(255, 255, 255, 0.02),
      0 24px 60px -12px rgba(0, 0, 0, 0.55);
    position: relative;
    transform-style: preserve-3d;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(
      circle 220px at var(--px, 50%) var(--py, 0%),
      rgba(255, 255, 255, 0.16),
      transparent 65%
    );
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .glass.lit::after { opacity: 1; }

  .glass:hover {
    border-color: var(--glass-border-strong);
  }

  /* ---------- Console ---------- */

  .console {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1.1rem;
    border-radius: 26px;
    opacity: 0;
    animation: rise 0.8s ease-out 0.4s forwards;
  }

  .console-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    padding: 0.35rem 0.35rem 0.35rem 1.2rem;
  }

  #intentInput {
    flex: 1;
    background: none;
    border: none;
    font-size: 1rem;
    padding: 0.6rem 0;
    color: var(--ink);
  }

  #intentInput::placeholder {
    color: var(--ink-faint);
  }

  #intentInput:focus {
    outline: none;
  }

  .console-bar:focus-within {
    border-color: rgba(255, 255, 255, 0.22);
  }

  .console-bar button[type="submit"] {
    flex-shrink: 0;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1.1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .console-bar button[type="submit"]:hover {
    filter: brightness(1.08);
    transform: scale(1.04);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 0 0.3rem;
  }

  .chip {
    font-family: var(--font-body);
    font-size: 0.85rem;
    color: var(--ink-dim);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 0.5rem 0.95rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }

  .chip:hover {
    color: var(--ink);
    border-color: rgba(255, 255, 255, 0.24);
    background: rgba(255, 255, 255, 0.07);
  }

  .chip[data-active="true"] {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ---------- Status row ---------- */

  .status-row {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding-left: 0.4rem;
    min-height: 1.1rem;
  }

  .status-row[hidden] { display: none; }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .status-row[data-state="thinking"] .status-dot {
    animation: pulse 0.9s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  #statusLabel {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce) {
    .status-row[data-state="thinking"] .status-dot { animation: none; }
  }

  /* ---------- Generated surface ---------- */

  .surface {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    min-height: 0.5rem;
  }

  .card {
    width: 100%;
    max-width: 520px;
    border-radius: 22px;
    padding: 1.5rem 1.6rem 1.6rem;
    animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .card.card-wide { max-width: 620px; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .card-kind {
    display: block;
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    color: var(--aurora-teal);
    margin-bottom: 0.5rem;
  }

  .card h3 {
    margin: 0 0 1.1rem;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }

  .card p {
    color: var(--ink-dim);
    line-height: 1.55;
    margin: 0;
  }

  .time-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.3rem;
  }

  .pill {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.03);
    color: var(--ink-dim);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pill:hover { border-color: rgba(255, 255, 255, 0.3); }

  .pill[data-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .mono { font-family: var(--font-mono); }
  .dim { color: var(--ink-faint); font-size: 0.72rem; letter-spacing: 0.08em; }

  .confirm {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.88rem;
    padding: 0.6rem 1.15rem;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: var(--void-deep);
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .confirm:hover { transform: translateY(-1px); filter: brightness(0.95); }

  .compare {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }

  .compare th {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    font-weight: 500;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .compare td {
    padding: 0.7rem 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    font-variant-numeric: tabular-nums;
  }

  .compare tr:last-child td { border-bottom: none; }
  .compare td:not(:first-child), .compare th:not(:first-child) { text-align: right; }

  .compare tr.best td:first-child::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--aurora-teal);
    margin-right: 0.5rem;
  }

  .spot-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .spot-list li {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .spot-name { flex: 1; font-weight: 500; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-quiet { background: var(--aurora-teal); box-shadow: 0 0 6px var(--aurora-teal); }
  .dot-hum { background: var(--aurora-amber); box-shadow: 0 0 6px var(--aurora-amber); }
  .dot-lively { background: var(--aurora-rose); box-shadow: 0 0 6px var(--aurora-rose); }

  footer {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    opacity: 0.6;
  }
</style>

<div class="aurora" aria-hidden="true">
  <span class="blob blob-teal"></span>
  <span class="blob blob-amber"></span>
  <span class="blob blob-rose"></span>
</div>

<main class="stage">
  <header class="thesis">
    <p class="eyebrow">Liquid glass &times; generative UI — a working demo</p>
    <h1>The screen isn't there <em>until</em> you ask for it.</h1>
    <p class="lede">Every panel below is built live from what you type, not loaded from a fixed screen. Try one of the three prompts and watch the surface take shape around it.</p>
  </header>

  <section class="console glass">
    <form class="console-bar" id="intentForm">
      <input type="text" id="intentInput" placeholder="Type what you need, or choose one below" autocomplete="off" />
      <button type="submit" aria-label="Generate surface">&#8594;</button>
    </form>
    <div class="chips" id="chips">
      <button type="button" class="chip" data-intent="table">a table for four, tonight</button>
      <button type="button" class="chip" data-intent="flights">compare flights to Lisbon</button>
      <button type="button" class="chip" data-intent="quiet">somewhere quiet to work nearby</button>
    </div>
  </section>

  <div class="status-row" id="statusRow" hidden>
    <span class="status-dot"></span>
    <span id="statusLabel" class="mono"></span>
  </div>

  <section class="surface" id="surface"></section>

  <footer>Prototype &middot; built to show, not just tell</footer>
</main>

<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var form = document.getElementById('intentForm');
  var input = document.getElementById('intentInput');
  var chips = document.getElementById('chips');
  var statusRow = document.getElementById('statusRow');
  var statusLabel = document.getElementById('statusLabel');
  var surface = document.getElementById('surface');

  var CARDS = {
    table: {
      label: '3 components',
      html:
        '<div class="card card-wide glass">' +
          '<span class="card-kind mono">RESERVATION</span>' +
          '<h3>Tonight, party of four</h3>' +
          '<div class="time-row">' +
            '<button type="button" class="pill" data-selected="true">7:30</button>' +
            '<button type="button" class="pill">8:00</button>' +
            '<button type="button" class="pill">8:45</button>' +
          '</div>' +
          '<div class="card-foot">' +
            '<span class="mono dim">4 GUESTS</span>' +
            '<button type="button" class="confirm">Hold this table</button>' +
          '</div>' +
        '</div>'
    },
    flights: {
      label: '4 components',
      html:
        '<div class="card card-wide glass">' +
          '<span class="card-kind mono">COMPARISON</span>' +
          '<h3>Flights to Lisbon, next weekend</h3>' +
          '<table class="compare">' +
            '<thead><tr><th>Carrier</th><th>Duration</th><th>Price</th></tr></thead>' +
            '<tbody>' +
              '<tr><td>TAP Air Portugal</td><td class="mono">7h 50m</td><td class="mono">$612</td></tr>' +
              '<tr class="best"><td>United &middot; 1 stop</td><td class="mono">11h 20m</td><td class="mono">$478</td></tr>' +
              '<tr><td>Delta</td><td class="mono">8h 05m</td><td class="mono">$694</td></tr>' +
            '</tbody>' +
          '</table>' +
        '</div>'
    },
    quiet: {
      label: '3 components',
      html:
        '<div class="card glass">' +
          '<span class="card-kind mono">NEARBY</span>' +
          '<h3>Quiet, within a mile</h3>' +
          '<ul class="spot-list">' +
            '<li><span class="dot dot-quiet"></span><span class="spot-name">Norther Caf&eacute;</span><span class="mono dim">0.2 mi</span></li>' +
            '<li><span class="dot dot-hum"></span><span class="spot-name">Untitled Library Bar</span><span class="mono dim">0.6 mi</span></li>' +
            '<li><span class="dot dot-lively"></span><span class="spot-name">Draft &amp; Table</span><span class="mono dim">0.9 mi</span></li>' +
          '</ul>' +
        '</div>'
    },
    unknown: {
      label: '1 component',
      html:
        '<div class="card glass">' +
          '<span class="card-kind mono">NOTE</span>' +
          '<h3>This prototype knows three intents</h3>' +
          '<p>Try one of the prompts below the console &mdash; a task, a comparison, and a scan each render a different shape of surface.</p>' +
        '</div>'
    }
  };

  function matchIntent(text) {
    var t = text.toLowerCase();
    if (/table|reservation|dinner|tonight/.test(t)) return 'table';
    if (/flight|lisbon|fly|airfare/.test(t)) return 'flights';
    if (/quiet|focus|work|library|nearby/.test(t)) return 'quiet';
    return 'unknown';
  }

  function setChipActive(key) {
    var chipEls = chips.querySelectorAll('.chip');
    for (var i = 0; i < chipEls.length; i++) {
      chipEls[i].dataset.active = chipEls[i].dataset.intent === key ? 'true' : 'false';
    }
  }

  var genToken = 0;

  function generate(key, sourceText) {
    var token = ++genToken;
    setChipActive(key);

    statusRow.hidden = false;
    statusRow.dataset.state = 'thinking';
    statusLabel.textContent = 'reading intent…';
    surface.innerHTML = '';

    var delay = reduceMotion ? 60 : 520;

    window.setTimeout(function () {
      if (token !== genToken) return;
      var entry = CARDS[key] || CARDS.unknown;
      var start = performance.now();
      surface.innerHTML = entry.html;
      var elapsed = ((performance.now() - start) / 1000 + (delay / 1000)).toFixed(1);
      statusRow.dataset.state = 'done';
      statusLabel.textContent = 'surface generated · ' + elapsed + 's · ' + entry.label;
      attachTilt(surface.querySelectorAll('.glass'));
    }, delay);
  }

  chips.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    input.value = chip.textContent;
    generate(chip.dataset.intent, chip.textContent);
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    generate(matchIntent(text), text);
  });

  /* ---- glass tilt + specular highlight, mouse-driven ---- */

  var tracked = [];

  function attachTilt(nodeList) {
    for (var i = 0; i < nodeList.length; i++) {
      var el = nodeList[i];
      if (tracked.indexOf(el) === -1) tracked.push(el);
      el.classList.add('lit');
    }
  }

  attachTilt(document.querySelectorAll('.console.glass'));

  var rafPending = false;
  var lastX = 0, lastY = 0;

  function updateTilt() {
    rafPending = false;
    for (var i = tracked.length - 1; i >= 0; i--) {
      var el = tracked[i];
      if (!el.isConnected) { tracked.splice(i, 1); continue; }
      var r = el.getBoundingClientRect();
      var px = ((lastX - r.left) / r.width) * 100;
      var py = ((lastY - r.top) / r.height) * 100;
      var nx = (lastX - (r.left + r.width / 2)) / (r.width / 2);
      var ny = (lastY - (r.top + r.height / 2)) / (r.height / 2);
      var inRange = px > -40 && px < 140 && py > -40 && py < 140;

      el.style.setProperty('--px', px + '%');
      el.style.setProperty('--py', py + '%');

      if (!reduceMotion && inRange) {
        var rx = Math.max(-1, Math.min(1, ny)) * -4;
        var ry = Math.max(-1, Math.min(1, nx)) * 4;
        el.style.transform = 'perspective(900px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
      } else if (!reduceMotion) {
        el.style.transform = '';
      }
    }
  }

  if (!reduceMotion) {
    window.addEventListener('mousemove', function (e) {
      lastX = e.clientX;
      lastY = e.clientY;
      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(updateTilt);
      }
    });
  }
})();
</script>
